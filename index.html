    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Vite HMR is disabled in AI Studio preview environment
      if (typeof window !== 'undefined' && window.WebSocket) {
        const _NativeWebSocket = window.WebSocket;
        window.WebSocket = function (url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/')))) {
            return {
              readyState: 1,
              send: function () {},
              close: function () {},
              addEventListener: function (type, listener) {
                if (type === 'open') setTimeout(listener, 0);
              },
              removeEventListener: function () {},
              dispatchEvent: function () { return true; }
            };
          }
          return new _NativeWebSocket(url, protocols);
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
